<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <!-- Actualizado a Tailwind v3 CDN para soporte completo de utilidades modernas (glassmorphism, gradientes, animaciones) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuente moderna Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #fdf2f8; /* pink-50 */
            background-image: 
                radial-gradient(at 0% 0%, rgba(251, 207, 232, 0.45) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(244, 114, 182, 0.25) 0px, transparent 50%);
        }

        /* Scrollbar personalizado sutil en tonos rosa */
        #chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        #chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }
        #chat-messages::-webkit-scrollbar-thumb {
            background: rgba(244, 114, 182, 0.35);
            border-radius: 9999px;
        }
        #chat-messages::-webkit-scrollbar-thumb:hover {
            background: rgba(236, 72, 153, 0.6);
        }

        /* Animación suave de entrada para mensajes */
        @keyframes messagePop {
            0% {
                opacity: 0;
                transform: translateY(10px) scale(0.97);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .animate-message {
            animation: messagePop 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, get } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "revistadigital-f5fd3.firebaseapp.com",
            databaseURL: "https://gashey-5be3c-default-rtdb.firebaseio.com",
            projectId: "revistadigital-f5fd3",
            storageBucket: "revistadigital-f5fd3.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.sendMessage = function() {
            const messageInput = document.getElementById("messageInput");
            const message = messageInput.value.trim();
            const username = localStorage.getItem('username') || 'Anonimo';
            if (message) {
                const messageData = {
                    username: username,
                    message: message
                };

                push(ref(db, 'chat'), messageData)
                    .then(() => {
                        console.log("Mensaje enviado con éxito");
                        messageInput.value = "";
                    })
                    .catch((error) => {
                        console.error("Error al enviar el mensaje:", error);
                    });
            } else {
                console.log("Mensaje vacío, no se enviará");
            }
        }

        // Helper para escapar HTML y evitar inyecciones visuales manteniendo intacta la lógica
        function escapeHTML(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function displayMessage(data) {
            const currentUsername = localStorage.getItem('username') || 'Anonimo';
            const isOwnMessage = data.username === currentUsername;
            const initial = (data.username || 'A').charAt(0).toUpperCase();

            const messageWrapper = document.createElement("div");
            messageWrapper.className = `flex w-full mb-3.5 animate-message ${isOwnMessage ? 'justify-end' : 'justify-start'}`;

            if (isOwnMessage) {
                // Burbuja de mensaje propio (alineada a la derecha, degradado rosa vibrante)
                messageWrapper.innerHTML = `
                    <div class="flex flex-col items-end max-w-[80%] sm:max-w-[70%]">
                        <span class="text-[11px] font-medium text-pink-500 mb-1 px-1">Tú (${escapeHTML(data.username)})</span>
                        <div class="bg-gradient-to-br from-pink-500 to-pink-600 text-white px-4 py-2.5 rounded-2xl rounded-tr-sm shadow-sm shadow-pink-200 text-sm sm:text-[15px] leading-relaxed break-words">
                            ${escapeHTML(data.message)}
                        </div>
                    </div>
                `;
            } else {
                // Burbuja de otros usuarios (alineada a la izquierda, con avatar e inicial)
                messageWrapper.innerHTML = `
                    <div class="flex items-end gap-2.5 max-w-[82%] sm:max-w-[72%]">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-pink-200 to-pink-300 border border-pink-300/60 flex items-center justify-center text-pink-700 font-bold text-xs flex-shrink-0 shadow-xs">
                            ${escapeHTML(initial)}
                        </div>
                        <div class="flex flex-col items-start">
                            <span class="text-[11px] font-semibold text-pink-600 mb-1 px-1">${escapeHTML(data.username)}</span>
                            <div class="bg-pink-100/90 border border-pink-200/80 text-gray-800 px-4 py-2.5 rounded-2xl rounded-tl-sm shadow-xs text-sm sm:text-[15px] leading-relaxed break-words">
                                ${escapeHTML(data.message)}
                            </div>
                        </div>
                    </div>
                `;
            }

            const chatMessages = document.querySelector('#chat-messages');
            chatMessages.appendChild(messageWrapper);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        onChildAdded(ref(db, 'chat'), function(snapshot) {
            const data = snapshot.val();
            console.log("Nuevo mensaje recibido:", data);
            displayMessage(data);
        }, (error) => {
            console.error("Error al recibir mensajes:", error);
        });

        function loadMessages() {
            const chatMessages = document.querySelector('#chat-messages');
            chatMessages.innerHTML = '';

            get(ref(db, 'chat')).then((snapshot) => {
                if (snapshot.exists()) {
                    snapshot.forEach((childSnapshot) => {
                        const data = childSnapshot.val();
                        displayMessage(data);
                    });
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }
            }).catch((error) => {
                console.error("Error al cargar mensajes:", error);
            });
        }

        function updateHeaderUserBadge(username) {
            const badge = document.getElementById('current-user-badge');
            if (badge && username) {
                badge.textContent = username;
                badge.parentElement.classList.remove('hidden');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedUsername = localStorage.getItem('username');
            if (!savedUsername) {
                document.querySelector('#username-form').classList.remove('hidden');
            } else {
                document.querySelector('#username-form').classList.add('hidden');
                updateHeaderUserBadge(savedUsername);
                loadMessages();
            }

            const submitUsername = () => {
                const usernameInput = document.getElementById('usernameInput');
                const username = usernameInput.value.trim();
                if (username) {
                    localStorage.setItem('username', username);
                    document.querySelector('#username-form').classList.add('hidden');
                    updateHeaderUserBadge(username);
                    loadMessages();
                }
            };

            document.querySelector('#username-submit').addEventListener('click', submitUsername);

            // Permitir también entrar presionando Enter en el modal de nombre
            document.getElementById('usernameInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    submitUsername();
                }
            });

            const messageInput = document.getElementById("messageInput");
            messageInput.addEventListener('keypress', function (event) {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    sendMessage();
                }
            });
        });
    </script>
</head>
<body class="h-screen flex flex-col items-center justify-center sm:p-4 md:p-6 overflow-hidden">

    <!-- Modal de ingreso de nombre con efecto Glassmorphism -->
    <div id="username-form" class="fixed inset-0 flex items-center justify-center bg-pink-950/25 backdrop-blur-md z-50 p-4 transition-opacity">
        <div class="bg-white/95 border border-pink-200 p-7 sm:p-8 rounded-3xl shadow-2xl shadow-pink-500/15 max-w-sm w-full text-center transform transition-all">
            <div class="w-14 h-14 bg-gradient-to-tr from-pink-400 to-pink-600 rounded-2xl mx-auto mb-4 flex items-center justify-center shadow-lg shadow-pink-300">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-800 mb-1">Bienvenido al Chat</h2>
            <p class="text-sm text-pink-600/80 mb-6">Elige un nombre para unirte a la sala</p>
            
            <div class="text-left mb-4">
                <input type="text" id="usernameInput" placeholder="Tu nombre o apodo..." maxlength="24"
                    class="w-full px-4 py-3 bg-pink-50/70 border border-pink-200 rounded-xl text-gray-800 placeholder-pink-300 focus:bg-white focus:outline-none focus:ring-2 focus:ring-pink-400 focus:border-transparent transition-all">
            </div>
            <button id="username-submit" 
                class="w-full bg-gradient-to-r from-pink-500 to-pink-600 hover:from-pink-600 hover:to-pink-700 active:scale-[0.98] text-white font-semibold py-3 px-4 rounded-xl shadow-md shadow-pink-300/60 transition-all cursor-pointer">
                Entrar a la sala
            </button>
        </div>
    </div>

    <!-- Contenedor Principal tipo App Card centrada en escritorio, pantalla completa en móvil -->
    <div class="w-full max-w-3xl h-full sm:h-[90vh] bg-white/85 backdrop-blur-xl sm:rounded-3xl shadow-xl shadow-pink-200/60 border border-pink-200/80 flex flex-col overflow-hidden">
        
        <!-- Header moderno -->
        <header class="bg-gradient-to-r from-pink-400 via-pink-500 to-pink-400 text-white px-5 py-4 flex items-center justify-between shadow-sm z-10 flex-shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-white/20 backdrop-blur-xs flex items-center justify-center border border-white/30">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.582 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zM9 9h2v2H9V9z" clip-rule="evenodd" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight leading-tight">Chat en Vivo</h1>
                    <div class="flex items-center gap-1.5 text-xs text-pink-100">
                        <span class="w-2 h-2 rounded-full bg-emerald-300 animate-pulse"></span>
                        <span>Sala conectada</span>
                    </div>
                </div>
            </div>

            <!-- Indicador de usuario actual -->
            <div class="hidden items-center gap-2 bg-white/15 border border-white/25 px-3 py-1.5 rounded-full text-xs font-medium backdrop-blur-xs">
                <span class="w-2 h-2 rounded-full bg-pink-100"></span>
                <span id="current-user-badge" class="truncate max-w-[110px]"></span>
            </div>
        </header>

        <!-- Área de mensajes -->
        <main id="chat-messages" class="flex-grow overflow-y-auto px-4 sm:px-6 py-5 bg-gradient-to-b from-pink-50/40 to-white/60 scroll-smooth">
            <!-- Los mensajes del chat se cargarán aquí -->
        </main>

        <!-- Barra inferior de escritura -->
        <footer class="bg-pink-50/90 border-t border-pink-200/80 px-4 py-3.5 sm:px-5 flex-shrink-0">
            <div class="flex items-center gap-2.5 bg-white border border-pink-200 rounded-2xl p-1.5 pl-4 shadow-xs focus-within:ring-2 focus-within:ring-pink-400 focus-within:border-transparent transition-all">
                <input type="text" id="messageInput" placeholder="Escribe un mensaje..." autocomplete="off"
                    class="flex-grow bg-transparent text-gray-800 placeholder-pink-300 text-sm sm:text-[15px] focus:outline-none py-1.5">
                <button onclick="sendMessage()" aria-label="Enviar mensaje"
                    class="bg-gradient-to-r from-pink-500 to-pink-600 hover:from-pink-600 hover:to-pink-700 active:scale-95 text-white font-medium px-4 py-2 rounded-xl shadow-sm shadow-pink-300/60 flex items-center gap-1.5 transition-all cursor-pointer flex-shrink-0">
                    <span class="text-sm hidden sm:inline">Enviar</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 transform rotate-90" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                    </svg>
                </button>
            </div>
        </footer>

    </div>

</body>
</html>
